name: Tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

# A PR push otherwise starts two identical jobs. Keep only the newest test
# for a branch; deployments to gh-pages don't need Python/Chromium test jobs.
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the scanner
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m playwright install --with-deps chromium
      - name: Build the web app
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Run tests, including the real-browser checks
        run: pytest -q
