[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aksharacheck"
version = "0.1.0"
description = "Evidence-first Hindi and Kannada website rendering scanner with verified AI repairs"
requires-python = ">=3.10"
dependencies = ["playwright>=1.50,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[project.scripts]
aksharacheck = "aksharacheck.cli:main"

[tool.setuptools.packages.find]
include=["aksharacheck*"]

[tool.pytest.ini_options]
testpaths=["tests"]
